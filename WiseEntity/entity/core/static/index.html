<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>无名 · 客厅</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141b24; --line:#22303f; --text:#dbe6f1;
    --dim:#7f8fa3; --me:#8ab4f8; --her:#7ee0c8; --warm:#f0b27a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 700px at 70% -10%,#17222f 0%,var(--bg) 60%);
    color:var(--text);font:15px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;
  }
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);}
  .blob{width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#8fe6d3,#3b7f8f 55%,#1c3540 100%);
    box-shadow:0 0 24px #3fb8a033, inset 0 -6px 12px #0006;flex:0 0 auto}
  .title{font-size:16px;letter-spacing:.5px}
  .mood{color:var(--her);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px}
  .chip{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  main{flex:1;display:grid;grid-template-columns:1fr 300px;gap:0;min-height:0}
  #log{overflow-y:auto;padding:18px 20px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:min(660px,86%);padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:#1d2a3a;border:1px solid #2a3d52;color:#cfe0f5}
  .her{align-self:flex-start;background:#152a28;border:1px solid #24443f;color:#cdf3ea}
  .sys{align-self:center;color:var(--dim);font-size:12px}
  footer{display:flex;gap:10px;padding:12px 20px 18px;border-top:1px solid var(--line)}
  textarea{
    flex:1;resize:none;height:52px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;outline:none
  }
  textarea:focus{border-color:#37637a}
  button{
    background:linear-gradient(180deg,#2a5d63,#1d4549);color:#d8f5ee;border:1px solid #2f6c70;
    border-radius:12px;padding:0 20px;font:inherit;cursor:pointer
  }
  button:disabled{opacity:.45;cursor:default}
  aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#0f151c}
  aside h3{margin:14px 16px 6px;font-size:12px;color:var(--dim);font-weight:500;letter-spacing:1px}
  aside input{
    margin:0 12px 8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:7px 10px;font:inherit;font-size:13px;outline:none
  }
  #mem{overflow-y:auto;padding:0 12px 16px;font-size:12.5px;color:#a9bacd}
  #mem .note{border-left:2px solid #2b4b52;padding:6px 8px;margin:6px 0;background:#111a22;border-radius:0 8px 8px 0}
  #mem .where{color:#5f7d8c;font-size:11px}
  @media (max-width:820px){ main{grid-template-columns:1fr} aside{display:none} }
</style>
</head>
<body>
<header>
  <div class="blob"></div>
  <div>
    <div class="title">无名 · 客厅</div>
    <div class="mood" id="mood">…</div>
  </div>
</header>
<div class="chips" id="chips"></div>

<main>
  <div id="log"></div>
  <aside>
    <h3>她记得的事</h3>
    <input id="q" placeholder="搜一个词，回车" />
    <div id="mem"></div>
  </aside>
</main>

<footer>
  <textarea id="box" placeholder="跟她说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">说</button>
</footer>

<script>
const log = document.getElementById('log');
const box = document.getElementById('box');
const sendBtn = document.getElementById('send');
const moodEl = document.getElementById('mood');
const chipsEl = document.getElementById('chips');
const memEl = document.getElementById('mem');
const qEl = document.getElementById('q');
const SESSION = 'web:owner';

function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'me' ? 'me' : role === 'sys' ? 'sys' : 'her');
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function refreshState(){
  try{
    const r = await fetch('/state');
    const s = await r.json();
    moodEl.textContent = s.mood_line || '（发呆）';
    chipsEl.innerHTML = '';
    const emo = s.emotions || {};
    for (const [k, v] of Object.entries(emo)){
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = k + ' ' + (Number(v) * 100).toFixed(0);
      chipsEl.appendChild(c);
    }
    if (s.situation){ const c = document.createElement('span'); c.className='chip'; c.textContent = s.situation; chipsEl.appendChild(c); }
  }catch(e){ moodEl.textContent = '（内核没回应）'; }
}

async function loadMem(q){
  try{
    const r = await fetch('/memory?session=' + encodeURIComponent(SESSION) + '&q=' + encodeURIComponent(q || ''));
    const j = await r.json();
    memEl.innerHTML = '';
    const notes = j.notes || [];
    if (!notes.length){ memEl.innerHTML = '<div class="note">没找到</div>'; return; }
    for (const n of notes){
      const d = document.createElement('div');
      d.className = 'note';
      d.innerHTML = '<div>' + escapeHtml(n.text || '') + '</div>' +
                    '<div class="where">' + escapeHtml((n.scope || '') + ' ' + (n.where || n.conv || '')) + '</div>';
      memEl.appendChild(d);
    }
  }catch(e){ memEl.innerHTML = '<div class="note">记忆读取失败</div>'; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function send(){
  const text = box.value.trim();
  if (!text) return;
  box.value = '';
  add('me', text);
  const pending = add('sys', '…');
  sendBtn.disabled = true;
  try{
    const r = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session: SESSION, text})
    });
    const j = await r.json();
    pending.remove();
    if (j.reply) add('her', j.reply);
    else add('sys', '（她没说话：' + (j.error || '空回复') + '）');
    refreshState();
  }catch(e){
    pending.textContent = '（连不上内核：' + e + '）';
  }finally{
    sendBtn.disabled = false;
    box.focus();
  }
}

sendBtn.onclick = send;
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') loadMem(qEl.value.trim()); });

add('sys', '她在这儿。窗户关着，但她在。');
refreshState();
loadMem('');
setInterval(refreshState, 20000);
</script>
</body>
</html>
