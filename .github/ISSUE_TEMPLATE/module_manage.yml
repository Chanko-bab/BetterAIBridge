name: 管理已有模组
description: 更新版本、移交开发权、下架或切换署名
title: "[模组管理] "
body:
  - type: input
    id: module_id
    attributes:
      label: 模组 id
      placeholder: my_module
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: 要做什么
      options:
        - 更新版本
        - 移交开发权
        - 下架
        - 切换署名 / 匿名
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 新版本号（更新版本时填）
      placeholder: 0.2.0

  - type: input
    id: release_url
    attributes:
      label: 新 Release 链接（更新版本时填）
      placeholder: https://github.com/you/repo/releases/tag/v0.2.0

  - type: input
    id: new_owner
    attributes:
      label: 接手人的 GitHub 账号（移交时填）
      description: 对方必须在本 Issue 里回复确认
      placeholder: "@new-owner"

  - type: textarea
    id: details
    attributes:
      label: 说明
      description: 变更内容、下架原因、署名切换目标等
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我是这个模组的所有者，或已获得所有者确认
          required: true
        - label: 移交开发权时，我和接手人都会在本 Issue 里明确回复
          required: true
